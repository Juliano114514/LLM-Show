<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Fashion · 浏览器逐组审校</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 16px; color: #292336; background: #eeeaf2; font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
    .page-header { max-width: 1740px; margin-bottom: 12px; }
    h1 { margin: 0 0 6px; font-size: 21px; line-height: 1.35; }
    .page-header p { margin: 4px 0; }
    #provenance { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, Consolas, monospace; }
    .notice { color: #675871; }
    .navigation { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
    button { min-width: 96px; padding: 7px 14px; border: 1px solid #a698b5; border-radius: 5px; color: #302639; background: #fff; font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    #status { min-width: 320px; font-weight: 650; }
    #status[data-state="error"], #fatal { color: #a12532; }
    #fatal { max-width: 1740px; white-space: pre-wrap; }
    #sheet { width: max-content; min-width: 572px; padding: 6px; background: #f3eef6; }
    #sheet[aria-busy="true"] { min-height: 120px; }
    .sheet-head { height: 50px; padding: 2px 4px; }
    .sheet-head h2 { margin: 0; height: 23px; font-size: 16px; line-height: 23px; }
    .sheet-head p { margin: 0; height: 19px; font: 11px/19px ui-monospace, Consolas, monospace; white-space: nowrap; }
    .pairs { display: grid; grid-template-columns: repeat(3, 572px); gap: 12px; width: max-content; }
    article { width: 572px; margin: 0; }
    .case-head { height: 22px; padding: 0 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 22px; }
    .pair-stages { display: grid; grid-template-columns: 280px 280px; gap: 12px; }
    figure { width: 280px; margin: 0; }
    figcaption { height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; color: #5b4566; font-size: 11px; line-height: 18px; }
    .stage { position: relative; width: 280px; height: 452px; background: #fff; outline: 1px solid #d5ccdf; overflow: hidden; }
    .stage > .layer { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .stage > img.layer { object-fit: fill; }
    .stage > img.reference { object-fit: contain; }
    .stage.reference-stage { background: #fff; }
    .detail-grid { display: block; width: 840px; }
    .detail-grid article, .detail-grid figure { width: 840px; }
    .detail-grid .stage { width: 840px; height: 1356px; }
    .empty-sheet { padding: 16px; color: #675871; }
    body.focus-mode { margin: 6px; font-size: 12px; line-height: 1.3; }
    .focus-mode .page-header { max-width: 1080px; margin-bottom: 2px; }
    .focus-mode h1 { margin: 0; font-size: 14px; line-height: 16px; }
    .focus-mode .page-header p { margin: 0; }
    .focus-mode #identity { font-size: 11px; line-height: 14px; }
    .focus-mode #provenance { font-size: 10px; line-height: 12px; }
    .focus-mode .notice { font-size: 10px; line-height: 12px; }
    .focus-mode .navigation { gap: 8px; margin: 3px 0; }
    .focus-mode button { padding: 2px 8px; font-size: 12px; line-height: 18px; }
    .focus-mode #sheet { padding: 4px; }
    .focus-mode .sheet-head { height: 32px; padding: 0 3px; }
    .focus-mode .sheet-head h2 { height: 18px; font-size: 13px; line-height: 18px; }
    .focus-mode .sheet-head p { height: 14px; font-size: 10px; line-height: 14px; }
    .focus-mode .pairs { grid-template-columns: 572px; }
    .focus-mode .case-head { height: 18px; font-size: 11px; line-height: 18px; }
    .focus-mode figcaption { height: 16px; font-size: 10px; line-height: 16px; }
    .focus-mode .detail-grid .stage { height: 452px; }
    .focus-mode .detail-grid .stage > .layer { inset: auto; left: 0; top: calc(0px - var(--strip-y, 0px)); width: 840px; height: 1356px; }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Fashion · 浏览器逐组审校</h1>
    <p id="identity">正在读取冻结输入</p>
    <p id="provenance"></p>
    <p class="notice">只读呈现该轮冻结 SVG 图层与标准原图；原生 100 为用户定义校准。本页不生成或保存评分。</p>
  </header>
  <nav class="navigation" aria-label="逐组审校导航">
    <button id="previous" type="button" disabled>上一组</button>
    <button id="next" type="button" disabled>下一组</button>
    <span id="status" role="status" aria-live="polite" data-state="loading">正在校验冻结输入</span>
  </nav>
  <p id="fatal" role="alert" hidden></p>
  <main id="sheet" aria-busy="true" data-state="loading"><p class="empty-sheet">正在载入</p></main>
  <script type="module" src="/src/browser-audit.mjs"></script>
</body>
</html>
